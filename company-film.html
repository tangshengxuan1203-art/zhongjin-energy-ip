维协同。","type":"live","stage":2},{"id":"12","start":72,"end":78,"subject":"移动端任务 近景","action":"使用演示账号打开一条巡检或维护任务，手指遮挡尽量少。","cut":"点开任务时切检查动作，表现同类工作流程。","type":"live","stage":3},{"id":"13","start":78,"end":84,"subject":"现场核查 中景","action":"工程师在允许区域看表、查看设备。固定机位拍完整核查动作。","cut":"动作做到一半切同一动作特写，手和身体方向保持一致。","type":"live","stage":3},{"id":"14","start":84,"end":90,"subject":"核查细节 特写","action":"补拍手指核对仪表、记录的动作。无需拆设备；仪表读数避拍或遮蔽。","cut":"记录动作接移动端填写；用同一只手和同一设备保持连贯。","type":"live","stage":3},{"id":"15","start":90,"end":96,"subject":"记录填写 手机特写","action":"演示填写检查结论、选择状态并提交；不展示具体个人信息。","cut":"点击提交后切已存在的记录页。若系统无联动，改普通记录查询。","type":"live","stage":3},{"id":"16","start":96,"end":102,"subject":"任务记录 高清录屏","action":"展示任务列表或已完成记录，只保留状态、分类等可公开字段。","cut":"停留后直接切报表查询，进入运行分析主题。","type":"screen","stage":3},{"id":"17","start":102,"end":110,"subject":"智能调参与运行记录 高清录屏","action":"展示项目当前可用的调参状态、策略记录或趋势查询，隐藏参数与成果数字；不现场执行控制。","cut":"切工程师核对策略与设备运行条件。","type":"screen","stage":4},{"id":"18","start":110,"end":117,"subject":"运行复盘 双人中景","action":"工程师核对运行趋势、设备资料与策略适用条件，说明分析需要结合现场。","cut":"指向资料时接知识与资料查询。","type":"live","stage":4},{"id":"19","start":117,"end":125,"subject":"设备资料与知识查询 高清录屏","action":"展示已上线的设备资料、规程或案例查询。智能问答未确认时保留普通资料检索，不制作虚假界面。","cut":"切院方与工程师共同使用平台。","type":"screen","stage":4},{"id":"20","start":125,"end":132,"subject":"共同使用 中景","action":"院方与中金能源人员同框查看平台，镜头在人物同侧，交流自然。","cut":"音乐保持，直接切回机房，呼应工作现场。","type":"live","stage":4},{"id":"21","start":132,"end":138,"subject":"机房正常运行 全景","action":"固定画面表现设备与人员，使用与03不同的角度，避免原片重复。","cut":"机房环境声短暂保留到下一镜并淡出。","type":"live","stage":5},{"id":"22","start":138,"end":145,"subject":"控制中心或公共空间 中景","action":"选择干净、有工作状态的一镜。旁白在约143秒结束，音乐轻收。","cut":"最后约半秒轻叠化至片尾，双方标识不与环境叠得难以辨认。","type":"live","stage":5},{"id":"23","start":145,"end":150,"subject":"静态片尾 图文","action":"医院及院区正式名称、项目名称、中金能源Logo和全称。比例与排序按确认稿。","cut":"完整停留5秒；音乐淡出至结束，不再追加二维码动画。","type":"design","stage":5}],"segments":[{"time":"00:00—00:18","title":"医院运行与后勤保障","voice":"医院每一天的有序运行，离不开能源与设备系统的持续保障。从机房到楼宇，后勤工作连接着医院运行的各个环节。","start":0,"end":18},{"time":"00:18—00:42","title":"需求与共同建设","voice":"围绕仁济医院能源与设备管理需求，中金能源开展设备梳理、数据接入与平台建设，逐步形成集中监视、运维协同与运行分析的管理支撑。","start":18,"end":42},{"time":"00:42—01:12","title":"平台集中展示","voice":"设备状态、能源计量与告警信息在平台中集中呈现。管理人员可以查看系统运行、查询历史趋势与能耗报表，让日常管理建立在连续的数据记录之上。","start":42,"end":72},{"time":"01:12—01:42","title":"日常运维应用","voice":"从巡检保养到告警处置，现场工作与平台记录相互衔接。通过任务流转、现场核查和结果回填，支持日常协同与过程追溯。","start":72,"end":102},{"time":"01:42—02:12","title":"运行优化与知识复用","voice":"在满足供能要求和设备运行边界的前提下，智能调参应用支持运行优化。设备资料、规程与故障经验持续整理，为人员查询、维护安排和知识复用提供支持。","start":102,"end":132},{"time":"02:12—02:30","title":"项目与品牌收口","voice":"中金能源，让设备更可靠，让能源更经济，让安全更可控。","start":132,"end":150}],"schedules":[{"headers":["时段","拍摄任务","对应镜号"],"rows":[["08:30—09:00","交底、频闪和曝光测试、人物与工装确认","准备"],["09:00—10:15","控制中心、使用平台、双方交流","04、05、07、11、20、22"],["10:15—11:30","机房巡检、设备核对、核查细节","03、06、13、14、21"],["13:00—14:00","手机任务、填写记录，补前后动作","12、15"],["14:00—15:00 并行","平台录屏：总览、能源、运维、调参、资料查询","08—10、16、17、19"],["14:00—15:00","院名、公共走廊、环境声、缺镜核对","01、02及补拍"],["离场前","随机打开素材检查，完成双份备份","核对全部现场镜号"]]}],"methods":[{"title":"一组场景的三种拍法","text":["全景先交代空间与人员位置。中景表现一个完整工作动作。特写补手部、仪表和资料。每种都拍至少两条，每条保留约12—20秒，动作前后各留稳定余量。表内6—8秒是成片使用时长，不是现场只拍这么久。"],"tables":[]},{"title":"四种主要切换","text":[],"tables":[{"headers":["方法","本片实例","现场必须准备什么"],"rows":[["直接切换","01到02，设备状态页到趋势页","两边主体清楚，景别或构图有变化，避免相近画面突然跳动。"],["动作接切","04手指向资料接05特写；13核查接14细节","拍同一动作两遍，保持手、衣着、动作方向与物件位置一致，在运动过程中找切点。"],["操作接录屏","07点击首页后切08高清录屏","同一页面状态、选中模块、窗口比例和光标位置；无需强行把整块屏幕飞入画面。"],["声音衔接","02到03提前进入机房声；21到22保留机房声","各场地录干净环境声，剪辑时声音与画面切点错开。"]]}]},{"title":"拍摄参数与器材","text":["相机或支持手动设置的手机均可，横向4K采集。建议以25fps、约1/50秒快门作为现场测试起点，现场LED灯和显示器仍需检查频闪。锁定白平衡与曝光，避免人物经过时亮度跳变。","以三脚架固定机位为主，通道移动只做低速短距离。手机优先主摄，避免数码变焦；特写通过合理靠近或切换合适镜头完成。先拍10秒测试并回看。","基本器材为主相机或手机、备用设备、三脚架、小型稳定器、录音设备和耳机、小型补光灯、备用电池与两份存储。无采访时无需为了形式额外布置采访机位。"],"tables":[]},{"title":"界面怎样做到清楚","text":["录屏建议1920×1080或以上，统一窗口比例和缩放。每页先停留、执行一个动作、再停留；录完整过程，后期取需要的一段。示意曲线使用可公开演示数据，生产数值不靠后期随意改写。","实拍显示器出现反光、频闪时，优先调整角度、曝光和拍法；清晰界面仍用录屏。偏振镜可能改变LCD显示，应测试后决定是否使用。"],"tables":[]},{"title":"开拍前完成四件事","text":["项目负责人确认院区名称、公司职责、片尾署名与可拍区域；技术人员确认可展示模块并提供一条脱敏演示路径；摄影提前踩点确认机位和光线；剪辑用临时配音与静帧先拼150秒结构。"],"tables":[]},{"title":"院内拍摄一天的建议顺序","text":["录屏和公司补拍另预留半天：08—10、16—19及片尾素材。按地点集中拍，不按成片顺序往返。实际排期服从院方可进入时段。"],"tables":[]},{"title":"后期按这个顺序做","text":["第一步先摆临时配音和23镜，删除重复信息。第二步剪顺动作、视线与录屏衔接；界面至少能看懂一个动作。第三步确认旁白与功能事实，再录正式配音，微调单镜时长但总长控制在三分钟内。第四步统一色彩、字幕、品牌与混音，导出后完整播放复核。"],"tables":[]},{"title":"人员怎么分工","text":["你负责院方协调、内容取舍与最终意见归并。技术同事负责功能事实、演示路径及界面脱敏。摄影负责现场机位、动作连续和声音素材。剪辑负责时间线、衔接、字幕和成片；不把缺失镜头或事实确认留给后期。"],"tables":[]},{"title":"不能拍到时如何替换","text":["走廊不能拍，改后勤通道；双方不能同时出镜，分别拍真实工作并取消双方同框表述；任务模块未上线，12—16改为查询、现场巡检、记录展示，旁白同步删除任务处理；界面不能公开，则使用院方确认的演示副本，保留演示标识。"],"tables":[]},{"title":"画册内容与项目事实如何区分","text":["仁济年度材料描述集中管控、云端协同与移动运维。本片不套用画册中的通用集中部署图，也不将所有产品场景表述为仁济已经上线。","镜头17—19优先录项目当前应用。录屏人员确认界面后再配正式旁白；通用产品场景留在公司版目录中，避免误作医院成果。"],"tables":[]}],"description":"以医院运行与日常应用为主，展示仁济项目中的平台使用和院企协作。","product":{"heading":"画册内容在仁济版中的取舍","intro":"用画册补强产品价值与专业表达，保留医院项目自身的应用范围。项目场景与产品能力分开说明。","values":[["安全运行支持","关联运行状态、风险信息与处置记录，支持人员核查和协同处理。"],["设备运维提效","围绕状态监测、故障诊断、巡检保养和维护记录开展管理。"],["能源消耗降本","通过计量、分析和运行优化，为用能管理提供依据。"],["知识资产沉淀","整理设备资料、业务规则与处置经验，支持查询和复用。"]],"architecture":[],"deployment":"仁济年度材料描述集中管控、云端协同与移动运维。本片不套用画册中的通用集中部署图，也不将所有产品场景表述为仁济已经上线。","delivery":[["项目共建","设备梳理、数据接入与平台建设对应镜头 04—07。"],["运行应用","集中监视、运维记录与智能调参对应镜头 08—18。"],["知识复用","设备资料、规程与案例查询对应镜头 19—20。"]],"groups":[],"mapping":[["设备与能源可视","08—11","集中呈现状态、计量、告警与历史查询。"],["运维协同","12—16","展现巡检、核查、回填与记录。"],["智能调参","17—18","展示已用应用的状态与复盘，保留人员和运行边界。"],["知识资料沉淀","19—20","展示项目可用的资料、规程与案例查询。"]],"notes":["画册中的预测性维护、视觉违章识别、多能调度等，不直接当作仁济已上线内容。","知识治理材料含后续规划，具体查询或问答镜头以现有可操作功能为准。","不披露节能率、设备规模、运行参数或费用；不为拍摄启停或修改生产参数。"],"source":"产品表达参照本次画册，项目范围结合仁济年度升级材料与已有分镜。"}},"company":{"key":"company","title":"中金能源公司与平台展示片","short":"公司通用版","duration":160,"subtitle":"本体驱动 × 大模型 × 智能体 · 画册融合执行版","filename":"中金能源公司与平台展示片_160秒执行方案_画册融合版.docx","shots":[{"id":"01","start":0,"end":6,"subject":"工程现场 中景","action":"我方工程师正常查看机房设备，工装标识可见；固定侧拍。","cut":"直接切同类技术工作，先建立专业工作形象。","type":"live","stage":0},{"id":"02","start":6,"end":12,"subject":"方案讨论 双人中景","action":"两名真实成员核对设备资料和流程图，桌面整洁；文件先脱敏。","cut":"指向电脑的动作接平台首页。","type":"live","stage":0},{"id":"03","start":12,"end":18,"subject":"产品总览 高清录屏","action":"公司统一演示环境中展示产品入口。片名使用能源与设备管理 AI 系统，不露具体生产数值。","cut":"直接切现场勘察；音乐与旁白连续。","type":"screen","stage":0},{"id":"04","start":18,"end":24,"subject":"场景调研 现场全景","action":"工程师查看系统、核对运行需求，画面对应实际设备与工作岗位。","cut":"在查看记录时切手部细节。","type":"live","stage":1},{"id":"05","start":24,"end":30,"subject":"设备与规则整理 特写","action":"展示脱敏设备关系、测点清单与业务规则，说明现场信息如何进入平台。","cut":"资料中的设备关系接数据接入和联调。","type":"live","stage":1},{"id":"06","start":30,"end":36,"subject":"数据治理与联调 中景加录屏","action":"技术人员在测试环境核对数据接入、字段和设备对应关系，拍操作与可见结果。","cut":"点击进入总览后切同页高清录屏。","type":"screen","stage":1},{"id":"07","start":36,"end":42,"subject":"五层能力架构 图形包装","action":"用简洁原生图形呈现现场感知、数据治理、AI能力底座、业务应用、统一展现；整体一次出现，仅高亮当前层。","cut":"从AI底座高亮切到知识本体或设备关系页面。","type":"design","stage":2},{"id":"08","start":42,"end":49,"subject":"知识本体与业务关系 录屏或示意","action":"优先展示现有知识建模界面；无真实界面时用设备、规则、经验的简图，标明架构示意。","cut":"由业务关系切到相关分析结果或建议。","type":"screen","stage":2},{"id":"09","start":49,"end":56,"subject":"智能分析与智能体 高清录屏","action":"展示已验证的分析任务、依据与建议；标明功能演示。无已验证界面时改展示知识检索。","cut":"以分析所用能源数据接能源管理模块。","type":"screen","stage":2},{"id":"10","start":56,"end":63,"subject":"能源计量与能效 高清录屏","action":"呈现能源分项、趋势或能效分析入口；采用演示环境，不展示项目成果数字。","cut":"点选一个类别切到趋势查询。","type":"screen","stage":3},{"id":"11","start":63,"end":70,"subject":"节能优化与调度 高清录屏","action":"选一个已具备的运行优化页面，展示策略建议或调参记录。多能调度未准备时不制作假界面。","cut":"切工程师核对策略和设备运行边界。","type":"screen","stage":3},{"id":"12","start":70,"end":78,"subject":"策略与运行边界 人物中景","action":"工程师核对运行策略和设备资料；不为拍摄下发生产控制指令。","cut":"视线或手势指向设备信息，接设备台账。","type":"live","stage":3},{"id":"13","start":78,"end":85,"subject":"设备档案与维护 高清录屏","action":"呈现设备资料、状态与维护记录；预测健康功能仅展示已验证页面。","cut":"同一设备切到状态记录。","type":"screen","stage":4},{"id":"14","start":85,"end":92,"subject":"故障诊断与处置建议 高清录屏","action":"展示异常依据、分析线索与建议。没有诊断界面时改状态与告警记录。","cut":"切现场核查，连接分析与人员判断。","type":"screen","stage":4},{"id":"15","start":92,"end":100,"subject":"现场核查与安全工作 中景","action":"拍工程师按现场要求核查设备、记录情况；作业审批或视觉识别只在真实可用时另录演示。","cut":"记录动作接移动端任务。","type":"live","stage":4},{"id":"16","start":100,"end":107,"subject":"移动任务 手机近景","action":"打开演示巡检或保养任务，完整展示查看动作。","cut":"点击记录入口接填写动作。","type":"live","stage":5},{"id":"17","start":107,"end":114,"subject":"执行记录 手部特写","action":"演示填写、拍照记录或选择状态；采用现有流程。","cut":"提交后切相应任务记录页。","type":"live","stage":5},{"id":"18","start":114,"end":122,"subject":"执行记录与知识归档 高清录屏","action":"任务完成后打开执行记录，再展示关联设备资料或已归档的处理经验。每个界面停留约三秒，隐藏人员、时间及业务数值。","cut":"从记录界面直接切部署示意，配乐连续，进入交付方式。","type":"screen","stage":5},{"id":"19","start":122,"end":130,"subject":"企业内网集中部署 图形包装","action":"企业服务器承载软件、模型与知识；现场为采集、控制和展示。标明部署示意，不画成边云分布计算。","cut":"示意图中的服务环节接驻场工程师。","type":"design","stage":6},{"id":"20","start":130,"end":138,"subject":"驻场实施与支持 中景","action":"工程师核对现场资料、与使用人员交流，体现调研、联调和应用支持。","cut":"从项目支持接培训或持续迭代。","type":"live","stage":6},{"id":"21","start":138,"end":146,"subject":"培训与长期迭代 中景","action":"拍真实应用培训、运行复盘或版本讨论，择一动作完整呈现。","cut":"音乐进入收束，直接切工程现场。","type":"live","stage":6},{"id":"22","start":146,"end":150,"subject":"工程现场 全景","action":"设备、人员同框，选择与开头不同的角度。","cut":"沿相似构图切公司平台。","type":"live","stage":7},{"id":"23","start":150,"end":155,"subject":"产品总览与品牌 高清录屏","action":"产品首页及公司标识，字幕采用让设备更可靠、让能源更经济、让安全更可控。","cut":"短叠化至公司静态片尾。","type":"screen","stage":7},{"id":"24","start":155,"end":160,"subject":"公司片尾 静态画面","action":"公司正式全称、Logo、统一产品名及经确认的联系入口。","cut":"静止5秒，音乐渐弱结束。","type":"design","stage":7}],"segments":[{"time":"00:00—00:18","title":"公司定位","voice":"中金能源推出能源与设备管理AI系统，面向工业企业与公共机构，将现场工程经验与数字化平台结合，服务能源、设备和运行管理。","start":0,"end":18},{"time":"00:18—00:36","title":"工程实施能力","voice":"从场景调研、设备梳理，到数据接入与规则整理，团队结合业务需求开展实施，让平台贴合设备、流程与现场工作。","start":18,"end":36},{"time":"00:36—00:56","title":"本体与 AI 底座","voice":"系统以数据治理为基础，将设备关系、工艺规则与专家经验组织为知识本体，结合大模型、专业算法与智能体，为分析和决策提供支持。","start":36,"end":56},{"time":"00:56—01:18","title":"能源管理","voice":"围绕用能管理，平台支持能源计量、能效分析 return `<section id="product"><div class="section-heading"><h2>${esc(p.heading)}</h2><span class="edition">画册融合版</span></div><p class="section-intro">${esc(p.intro)}</p><div class="value-grid">${p.values.map(v=>`<article class="value-item"><h3>${esc(v[0])}</h3><p>${esc(v[1])}</p></article>`).join('')}</div>${p.architecture.length?`<details class="product-detail"><summary>技术底座与部署方式</summary><div class="architecture">${p.architecture.map(a=>`<div class="architecture-layer"><strong>${esc(a[0])}</strong><p>${esc(a[1])}</p></div>`).join('')}</div><p class="deployment-note">${esc(p.deployment)}</p></details>`:`<p class="deployment-note">${esc(p.deployment)}</p>`}<h3 class="product-subheading">能力与镜头对应</h3>${table(['展示重点','对应镜号','实现方式'],p.mapping)}<div class="delivery-grid">${p.delivery.map(a=>`<article><h3>${esc(a[0])}</h3><p>${esc(a[1])}</p></article>`).join('')}</div>${p.groups.length?`<details class="product-detail catalogue"><summary>查看完整产品场景 · ${p.groups.reduce((n,g)=>n+g[1].length,0)} 项</summary><p class="section-intro">这是产品选材目录；主片使用代表性功能，不逐项铺满。具体功能以可演示版本为准。</p><div class="catalogue-grid">${p.groups.map(g=>`<article><h3>${esc(g[0])}</h3><ul>${g[1].map(x=>`<li><span>${esc(x[0])}</span>${esc(x[1])}</li>`).join('')}</ul></article>`).join('')}</div></details>`:''}<details class="product-detail scope"><summary>拍摄口径与替代原则</summary><ul>${p.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul><p class="source-note">${esc(p.source)}</p></details></section>`;
}

const nav=[['overview','影片结构','timeline'],['product','产品与功能','box'],['shots','分镜脚本','film'],['voice','完整旁白','list'],['execution','拍摄执行','clap'],['assets','素材清单','box']];
const checklist=['正式项目名、产品名与片尾署名','公司 Logo 源文件与工装','可拍区域、日期及出镜人员','可展示功能与演示操作路径','脱敏演示账号和平台录屏','现场拍摄与对应镜号清单','临时配音及已确认的旁白','配乐、环境声与双份备份','画册能力与项目已用功能逐项核对','架构示意标注、真实录屏与替代镜头'];
let checked=[];try{checked=JSON.parse(localStorage.getItem('film-checks-'+key)||'[]');if(!Array.isArray(checked))checked=[];}catch{}
$('#app').innerHTML=`<aside class="sidebar"><div class="wordmark">中金能源</div><div class="doc-switch"><a href="renji-film.html" class="${key==='renji'?'active':''}" ${key==='renji'?'aria-current="page"':''}>${icon('document')}仁济医院版</a><a href="company-film.html" class="${key==='company'?'active':''}" ${key==='company'?'aria-current="page"':''}>${icon('document')}公司通用版</a></div><nav class="section-nav" aria-label="页面章节">${nav.map(([id,name,ic])=>`<a href="#${id}" data-nav="${id}">${icon(ic)}${name}</a>`).join('')}</nav><div class="sidebar-note">非叙事展示 · 不披露具体数据<br>镜头、旁白与执行统一查看</div></aside><main class="main"><header class="page-header"><div><h1>${esc(d.title)}</h1><p class="subtitle">${esc(d.subtitle)}</p></div><div class="actions"><button class="button" id="print">${icon('print')}打印方案</button><a class="button primary" href="film-guide-assets/${key}-guide.docx" download>${icon('download')}下载 Word</a></div></header><div class="summary-strip"><div class="metric"><strong>${d.duration}</strong><span>秒</span></div><div class="metric"><strong>${d.shots.length}</strong><span>个镜头</span></div><div class="metric"><strong>${d.segments.length}</strong><span>个段落</span></div></div><section id="overview"><h2>影片结构与时间轴</h2><p class="section-intro">${esc(d.description)}点击段落，可筛选查看对应分镜。</p><div class="timeline" style="--parts:${d.segments.length}">${d.segments.map((s,i)=>`<button class="stage" data-stage="${i}" aria-pressed="false"><span class="stage-name">${esc(s.title)}</span><span class="stage-time">${tm(s.start)} — ${tm(s.end)}</span><span class="stage-duration">${s.end-s.start} 秒</span></button>`).join('')}</div></section>${productSection(d.product)}<section id="shots"><h2>分镜脚本</h2><div class="toolbar"><label class="search">${icon('search')}<input id="shot-search" type="search" placeholder="搜索镜头内容，如：机房、平台、运维" aria-label="搜索镜头"></label><div class="filters" role="group" aria-label="素材类型"><button class="filter active" data-type="all" aria-pressed="true">全部</button><button class="filter" data-type="live" aria-pressed="false">现场实拍</button><button class="filter" data-type="screen" aria-pressed="false">平台录屏</button></div></div><div class="filter-status"><span id="result-count" aria-live="polite"></span><button class="clear-button" id="clear-filters">清除筛选</button></div><div class="table-wrap"><table class="shots"><thead><tr><th scope="col">镜号 / 时间</th><th scope="col">画面与机位</th><th scope="col">拍摄动作</th><th scope="col">镜头衔接</th></tr></thead><tbody id="shot-body"></tbody></table></div><p class="print-note">点击镜头行，可展开对应旁白。时间码为建议剪辑安排，正式配音后校准节奏。</p></section><section id="voice"><div class="section-heading"><h2>完整旁白</h2><button class="button" id="copy-all">复制全部旁白</button></div><p class="section-intro">按段落连续录制，句子可跨镜头延续；只保留已确认且可公开的功能表述。</p><div class="voice-list">${d.segments.map((s,i)=>`<article class="voice-block"><div class="voice-head"><div><span class="voice-time">${tm(s.start)} — ${tm(s.end)}</span><h3>${esc(s.title)}</h3></div><button class="copy-button" data-copy="${i}" aria-label="复制${esc(s.title)}旁白">复制</button></div><p>${esc(s.voice)}</p></article>`).join('')}</div></section><section id="execution"><h2>拍摄执行</h2><p class="section-intro">按场地集中拍摄，再按镜头顺序剪辑。每处拍齐全景、中景与特写，界面另录高清版本。</p>${d.schedules.map(s=>`<table class="schedule"><thead><tr>${s.headers.map(x=>`<th scope="col">${esc(x)}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`).join('')}<div class="method-grid">${d.methods.map(m=>`<article class="method"><h3>${esc(m.title)}</h3>${m.text.map(t=>`<p>${esc(t)}</p>`).join('')}${(m.tables||[]).map(t=>`<table class="schedule"><thead><tr>${t.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`).join('')}</article>`).join('')}</div></section><section id="assets"><div class="section-heading"><h2>素材清单</h2><span class="check-progress" id="check-progress"></span></div><p class="section-intro">按实际准备情况勾选，进度保留在当前浏览器。</p><div class="checklist">${checklist.map((x,i)=>`<label class="check-item ${checked.includes(i)?'done':''}"><input type="checkbox" data-check="${i}" ${checked.includes(i)?'checked':''}><span>${esc(x)}</span></label>`).join('')}</div><button class="clear-button" id="reset-checks">重置准备状态</button></section><footer class="footer"><div>${esc(d.short)} · 拍摄执行手册<br>保留实际功能，统一脱敏展示。网页仅展示拍摄方案，不代表成片已完成。</div><div><a href="https://www.adobe.com/creativecloud/video/discover/shot-list.html" target="_blank" rel="noopener">镜头清单方法</a><a href="${key==='renji'?'company-film':'renji-film'}.html">查看${key==='renji'?'公司通用版':'仁济医院版'}</a></div></footer></main><div id="toast" class="toast" role="status" hidden></div>`;
function renderShots(){const rows=d.shots.filter(s=>(type==='all'||s.type===type)&&(stage===null||s.stage===stage)&&(!query||[s.id,s.subject,s.action,s.cut,d.segments[s.stage].title].join(' ').toLowerCase().includes(query)));
$('#result-count').textContent=`显示 ${rows.length} / ${d.shots.length} 个镜头${stage===null?'':' · '+d.segments[stage].title} · 点击镜头展开旁白`;
$('#shot-body').innerHTML=rows.length?rows.map(s=>`<tr class="shot-row ${selected===s.id?'selected':''}" data-shot="${s.id}" tabindex="0" role="button" aria-expanded="${selected===s.id}" aria-label="镜头${s.id} ${esc(s.subject)}，查看旁白"><td><span class="shot-number">${s.id}</span><span class="shot-time">${tm(s.start)}–${tm(s.end)}</span></td><td><span class="shot-subject">${esc(s.subject)}</span><span class="shot-type">${s.type==='screen'?'平台录屏':s.type==='live'?'现场实拍':'图形包装'} · ${s.end-s.start} 秒</span></td><td>${esc(s.action)}</td><td>${esc(s.cut)}</td></tr>${selected===s.id?`<tr class="inspector"><td colspan="4"><div class="inspector-layout"><div class="inspector-title">镜头 ${s.id}<br><small>${esc(d.segments[s.stage].title)}</small></div><div><small>本段旁白</small><p>${esc(d.segments[s.stage].voice)}</p><small>旁白在整个段落内分配，无需在本镜头内全部读完。</small></div></div></td></tr>`:''}`).join(''):'<tr><td colspan="4" class="no-results">没有匹配的镜头，请调整关键词或清除筛选。</td></tr>';
document.querySelectorAll('.stage').forEach(x=>x.setAttribute('aria-pressed',String(stage===Number(x.dataset.stage))));
document.querySelectorAll('[data-shot]').forEach(x=>{const select=()=>{selected=selected===x.dataset.shot?null:x.dataset.shot;renderShots();};x.addEventListener('click',select);x.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select();}});});}
function notify(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,2200);}
async function copy(t){try{await navigator.clipboard.writeText(t);notify('旁白已复制');}catch{const el=document.createElement('textarea');el.value=t;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();const ok=document.execCommand('copy');el.remove();notify(ok?'旁白已复制':'复制未完成，请选择文字后复制');}}
$('#shot-search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();renderShots();});
document.querySelectorAll('[data-type]').forEach(x=>x.addEventListener('click',()=>{type=x.dataset.type;document.querySelectorAll('[data-type]').forEach(b=>{b.classList.toggle('active',b===x);b.setAttribute('aria-pressed',String(b===x));});renderShots();}));
document.querySelectorAll('[data-stage]').forEach(x=>x.addEventListener('click',()=>{stage=stage===Number(x.dataset.stage)?null:Number(x.dataset.stage);type='all';query='';$('#shot-search').value='';document.querySelectorAll('[data-type]').forEach(b=>{b.classList.toggle('active',b.dataset.type==='all');b.setAttribute('aria-pressed',String(b.dataset.type==='all'));});renderShots();$('#shots').scrollIntoView({behavior:'smooth'});}));
$('#clear-filters').addEventListener('click',()=>{stage=null;type='all';query='';$('#shot-search').value='';document.querySelectorAll('[data-type]').forEach(b=>{b.classList.toggle('active',b.dataset.type==='all');b.setAttribute('aria-pressed',String(b.dataset.type==='all'));});renderShots();});
$('#copy-all').addEventListener('click',()=>copy(d.segments.map(x=>`${x.time} ${x.title}\n${x.voice}`).join('\n\n')));document.querySelectorAll('[data-copy]').forEach(x=>x.addEventListener('click',()=>copy(d.segments[Number(x.dataset.copy)].voice)));
function updateChecks(){checked=Array.from(document.querySelectorAll('[data-check]:checked')).map(x=>Number(x.dataset.check));document.querySelectorAll('[data-check]').forEach(x=>x.closest('label').classList.toggle('done',x.checked));$('#check-progress').textContent=`已准备 ${checked.length} / ${checklist.length} 项`;try{localStorage.setItem('film-checks-'+key,JSON.stringify(checked));}catch{}}
document.querySelectorAll('[data-check]').forEach(x=>x.addEventListener('change',updateChecks));$('#reset-checks').addEventListener('click',()=>{document.querySelectorAll('[data-check]').forEach(x=>x.checked=false);updateChecks();});
$('#print').addEventListener('click',()=>{const detailStates=Array.from(document.querySelectorAll('details')).map(el=>[el,el.open]);detailStates.forEach(([el])=>el.open=true);const old={query,type,stage,selected};query='';type='all';stage=null;selected=null;renderShots();window.print();detailStates.forEach(([el,open])=>el.open=open);({query,type,stage,selected}=old);renderShots();});
if('IntersectionObserver' in window){const observer=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting)document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===e.target.id));});},{rootMargin:'-5% 0px -65% 0px'});document.querySelectorAll('main section').forEach(x=>observer.observe(x));}
renderShots();updateChecks();
})();
</script></body></html>
