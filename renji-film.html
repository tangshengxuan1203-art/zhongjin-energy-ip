</style></head><body data-guide="renji"><div id="app"></div><noscript><p>此浏览器未启用 JavaScript。请下载完整执行方案：<a href="film-guide-assets/renji-guide.docx?v=20261119-four-values">下载 Word</a>。</p></noscript><script>window.FILM_GUIDES = {"renji":{"key":"renji","title":"仁济医院项目展示片","short":"仁济医院版","duration":150,"subtitle":"安全生产兜底 · 设备运维提效 · 能源消耗降本 · 知识资产沉淀","filename":"仁济医院项目展示片_150秒_四项价值主线执行稿.docx","shots":[{"id":"01","start":0,"end":6,"subject":"控制中心 全景","action":"平视固定机位，拍值班人员与总览屏的真实工作状态。片名延后出现，屏上生产数值预先脱敏。","cut":"沿工作人员视线切中景，保留连续环境声。","type":"live","stage":0},{"id":"02","start":6,"end":12,"subject":"平台操作 越肩中景","action":"同侧越肩拍值班员打开总览，完整保留点击前后动作，不要求触摸不支持触控的屏幕。","cut":"在点击落下时切同页高清录屏，页面与选中模块一致。","type":"live","stage":0},{"id":"03","start":12,"end":18,"subject":"一屏总览 高清录屏","action":"首页停留，叠加四项价值的简洁章节条。没有四分区的原生界面时，不制作虚假功能区。","cut":"从总览直接切状态监视，出现章名安全生产兜底；旁白连续。","type":"screen","stage":0},{"id":"04","start":18,"end":25,"subject":"设备状态监视 高清录屏","action":"选用项目可公开的设备状态或配电监视页，只保留系统结构和运行状态。","cut":"同一设备或同一系统切到已有告警记录。","type":"screen","stage":1},{"id":"05","start":25,"end":32,"subject":"告警与事件记录 高清录屏","action":"查询已有演示告警，停留在事件、状态与处理入口。隐藏时间戳、设备编号及具体数值，不现场制造告警。","cut":"按异常对应关系直接切现场核查，不假扮突发事故。","type":"screen","stage":1},{"id":"06","start":32,"end":39,"subject":"值班核查 中景","action":"工作人员在允许区域查看设备、核对记录。固定侧拍完整动作，保持工作方向。","cut":"核查动作接控制状态或规程的手部近景。","type":"live","stage":1},{"id":"07","start":39,"end":46,"subject":"运行与保护边界 近景","action":"拍工程师核对控制状态或操作规程。手动接管、保护逻辑仅用已确认界面或资料展示，不切换生产模式。","cut":"直接切回总览再进入设备档案；设备运维提效章名落下。","type":"live","stage":1},{"id":"08","start":46,"end":53,"subject":"设备档案 高清录屏","action":"打开同一设备的资料和维护记录，展示设备信息与维护工作的对应关系。","cut":"由设备记录直接接移动巡检任务。","type":"screen","stage":2},{"id":"09","start":53,"end":60,"subject":"巡检任务 手机近景","action":"演示账号查看巡检或保养任务，只展示现有路径。没有任务模块时改为巡检记录查询并同步调整旁白。","cut":"在查看检查项时切到同类现场动作。","type":"live","stage":2},{"id":"10","start":60,"end":67,"subject":"巡检与记录 中景加特写","action":"同一人员先检查再记录，各拍一条完整动作；补手部与设备对应细节。仪表读数避拍。","cut":"在填写完成时切任务记录，保持设备类别一致。","type":"live","stage":2},{"id":"11","start":67,"end":74,"subject":"执行与维护记录 高清录屏","action":"展示已完成记录或状态查询，只保留分类、处理状态与可公开字段。","cut":"短回总览后切能源分项，出现能源消耗降本章名。","type":"screen","stage":2},{"id":"12","start":74,"end":80,"subject":"能源分类 高清录屏","action":"展示分项、楼宇或系统分类入口，以项目当前可用维度为准，不声称未落地的床位级计量。","cut":"点选一类能源，直接切历史趋势页。","type":"screen","stage":3},{"id":"13","start":80,"end":86,"subject":"能耗与历史分析 高清录屏","action":"展示趋势形态与查询动作。隐藏坐标具体数值，演示数据保留标识，不加入节能比例。","cut":"以同一系统的查询关系接智能调参状态。","type":"screen","stage":3},{"id":"14","start":86,"end":92,"subject":"智能调参状态 高清录屏","action":"展示现有调参状态或策略记录，只读查询，不现场下发控制，不显示设定参数或效果数字。","cut":"按屏幕视线关系切工程师复核。","type":"screen","stage":3},{"id":"15","start":92,"end":98,"subject":"运行策略复核 双人中景","action":"院方或工程师结合资料查看运行策略与适用条件，自然交流，不安排采访台词。","cut":"在指向记录时直接切对应策略记录页。","type":"live","stage":3},{"id":"16","start":98,"end":104,"subject":"策略记录与复盘 高清录屏","action":"查询项目现有运行记录，呈现策略与记录之间的关系；不合成虚假前后效果对比。","cut":"短回总览后进入资料库，出现知识资产沉淀章名。","type":"screen","stage":3},{"id":"17","start":104,"end":111,"subject":"设备资料归集 高清录屏","action":"打开已可用的设备资料、手册或规程目录，资料封面与正文均先脱敏。","cut":"在选择分类时切同一资料的检索过程。","type":"screen","stage":4},{"id":"18","start":111,"end":118,"subject":"规程与资料检索 高清录屏","action":"输入普通设备或规程关键词，展示已有检索结果。智能问答未确认时使用普通资料查询。","cut":"由检索结果切到相关维护记录或案例。","type":"screen","stage":4},{"id":"19","start":118,"end":125,"subject":"维护经验与记录 高清录屏","action":"展示已归档记录或可公开案例。没有案例审核、图谱更新功能时只展示资料关联，不制作虚假入库动效。","cut":"切到院方与工程师共同查阅资料的中景。","type":"screen","stage":4},{"id":"20","start":125,"end":132,"subject":"资料使用与交接 双人中景","action":"院方人员与工程师同侧看屏、核对资料，表现查阅与交流。真实岗位出镜，工装Logo自然可见。","cut":"音乐保持，直接切机房运行画面。","type":"live","stage":4},{"id":"21","start":132,"end":138,"subject":"机房运行 全景","action":"设备与人员同框，选择通道安全、光线稳定的角度，画面整洁有工作状态。","cut":"环境声延续到控制中心，呼应开场。","type":"live","stage":5},{"id":"22","start":138,"end":145,"subject":"回到一屏总览 中景","action":"控制中心值班人员与总览同框，四项价值章节条轻落，旁白在本镜结束前收完。","cut":"最后半秒轻叠化到静态片尾。","type":"live","stage":5},{"id":"23","start":145,"end":150,"subject":"医院与公司片尾 静态画面","action":"医院及院区正式名称、项目名称在前，中金能源Logo与正式全称做支持署名，按确认稿排版。","cut":"完整静止五秒，音乐渐弱结束。","type":"design","stage":5}],"segments":[{"time":"00:00—00:18","title":"一屏总览","start":0,"end":18,"voice":"这里是仁济医院能源与设备管理平台。围绕医院日常运行，将设备信息与管理工作连接起来，形成安全、运维、能源和知识四个方面的管理支撑。"},{"time":"00:18—00:46","title":"安全生产兜底","start":18,"end":46,"voice":"医院的运行保障，首先要把状态看清、把异常及时传递。平台集中呈现设备状态与告警记录，支持值班核查和处置追踪；智能调参在既有控制与保护边界内运行，保留人员接管。"},{"time":"00:46—01:14","title":"设备运维提效","start":46,"end":74,"voice":"从设备资料到巡检保养，从现场核查到结果回填，平台把日常运维连接起来。工作人员查看任务、记录过程，管理人员查询状态，让协作有依据，让维护可追溯。"},{"time":"01:14—01:44","title":"能源消耗降本","start":74,"end":104,"voice":"在满足医院供能要求的前提下，能源计量、历史分析与智能调参相互配合。结合运行条件查看策略、复盘记录，为参数优化和用能管理提供依据，支持持续降本。"},{"time":"01:44—02:12","title":"知识资产沉淀","start":104,"end":132,"voice":"设备资料、操作规程和维护经验，需要持续整理，也需要方便使用。通过资料查询、记录归档与现场交流，支持经验复用和人员交接，让知识逐步沉淀为医院的管理资产。"},{"time":"02:12—02:30","title":"医院与品牌收口","start":132,"end":150,"voice":"以安全为基础，让设备运维更高效，让能源管理更精细，让经验持续积累。中金能源，与医院共同完善日常运行保障。"}],"schedules":[{"headers":["拍摄批次","任务与镜号","安排"],"rows":[["控制中心","01、02、15、20、22；值班、复核与资料交流","上午集中拍摄，约一至两小时。"],["机房与设备","06、07、10、21；核查、规程、巡检、运行","按可进入区域集中拍，约一至两小时。"],["手机操作","09；巡检或维护任务","与同一巡检人员和工装连拍。"],["平台录屏","03—05、08、11—14、16—19","办公室另录半天，先确认功能和脱敏版本。"],["后期包装","四项价值章名、总览指引、23片尾","不虚构软件分区，正式配音后校准节奏。"]]}],"methods":[{"title":"用一屏总览连接四项价值","text":["每章入口回到同一张平台总览，再直接切对应模块。章名只出现一次，颜色、位置与停留时间一致；音乐和旁白跨镜头连续。","平台原有界面没有四分区时，后期用独立章节条标出四项价值，不把包装伪装成软件原生功能。只在演示环境展示查询与状态，不为拍摄操作生产控制。"],"tables":[]},{"title":"四种主要切换","text":[],"tables":[{"headers":["方法","本片实例","拍摄要点"],"rows":[["直接切换","03总览到04状态页，12能源分类到13趋势页","界面窗口和缩放一致；一镜只完成一个动作。"],["动作接切","09手机任务接10现场巡检","同一人物、同一设备类别、相同动作方向。"],["操作接录屏","02越肩点击接03高清总览","对齐模块、光标位置与页面状态。"],["声音衔接","21机房画面接22控制中心","环境声延后淡出，旁白和音乐连续。"]]}]},{"title":"一组场景的三种拍法","text":["全景先交代空间与人员位置。中景表现一个完整工作动作。特写补手部、仪表和资料。每种都拍至少两条，每条保留约12—20秒，动作前后各留稳定余量。表内6—8秒是成片使用时长，不是现场只拍这么久。"],"tables":[]},{"title":"拍摄参数与器材","text":["相机或支持手动设置的手机均可，横向4K采集。建议以25fps、约1/50秒快门作为现场测试起点，现场LED灯和显示器仍需检查频闪。锁定白平衡与曝光，避免人物经过时亮度跳变。","以三脚架固定机位为主，通道移动只做低速短距离。手机优先主摄，避免数码变焦；特写通过合理靠近或切换合适镜头完成。先拍10秒测试并回看。","基本器材为主相机或手机、备用设备、三脚架、小型稳定器、录音设备和耳机、小型补光灯、备用电池与两份存储。无采访时无需为了形式额外布置采访机位。"],"tables":[]},{"title":"界面怎样做到清楚","text":["录屏建议1920×1080或以上，统一窗口比例和缩放。每页先停留、执行一个动作、再停留；录完整过程，后期取需要的一段。示意曲线使用可公开演示数据，生产数值不靠后期随意改写。","实拍显示器出现反光、频闪时，优先调整角度、曝光和拍法；清晰界面仍用录屏。偏振镜可能改变LCD显示，应测试后决定是否使用。"],"tables":[]},{"title":"开拍前完成四件事","text":["项目负责人确认院区名称、公司职责、片尾署名与可拍区域；技术人员确认可展示模块并提供一条脱敏演示路径；摄影提前踩点确认机位和光线；剪辑用临时配音与静帧先拼150秒结构。"],"tables":[]},{"title":"后期按这个顺序做","text":["第一步先摆临时配音和23镜，删除重复信息。第二步剪顺动作、视线与录屏衔接；界面至少能看懂一个动作。第三步确认旁白与功能事实，再录正式配音，微调单镜时长但总长控制在三分钟内。第四步统一色彩、字幕、品牌与混音，导出后完整播放复核。"],"tables":[]},{"title":"人员怎么分工","text":["你负责院方协调、内容取舍与最终意见归并。技术同事负责功能事实、演示路径及界面脱敏。摄影负责现场机位、动作连续和声音素材。剪辑负责时间线、衔接、字幕和成片；不把缺失镜头或事实确认留给后期。"],"tables":[]},{"title":"不能拍到时如何替换","text":["任务模块未上线，09—11改为巡检查询、现场执行、记录展示，旁白同步删去任务流转；知识库仅有资料管理，17—19保留资料、规程与记录，不演示智能问答或图谱更新；不能双方同框，分别拍实际工作。"],"tables":[]},{"title":"画册内容与项目事实如何区分","text":["四个章名是影片的价值方向，不表示医院已经部署画册全部功能。安全段用运行保障支撑，不拍未经确认的视觉识别；运维段用现有任务和记录支撑，不直接声称已实现预测性维护。","能源段保留已用智能调参和复盘，知识段保留可操作的资料查询。原脚本中的收益、精度、规模与提前量不进入本片。"],"tables":[]}],"description":"以统一平台为视觉主轴，依次呈现安全、设备、能源、知识四项价值。医院应用是主体，中金能源的工程与服务能力在实际工作中体现。","product":{"heading":"四项价值决定全片结构","intro":"一屏总览负责连接章节。四项价值各讲清一个管理作用，平台功能与现场工作负责证明，技术架构作为补充说明。","values":[["安全生产兜底","状态集中监视、告警记录与人工核查，支持日常风险处置。"],["设备运维提效","巡检、保养、任务与回填连接起来，让维护工作可追溯。"],["能源消耗降本","计量分析结合智能调参，在供能与运行边界内支持优化。"],["知识资产沉淀","资料、规程与维护经验持续整理，支持查询、复用和交接。"]],"architecture":[],"deployment":"仁济年度材料描述集中管控、云端协同与移动运维。本片不套用画册中的通用集中部署图，也不将所有产品场景表述为仁济已经上线。","delivery":[["统一画面主轴","每章从总览进入应用，章末用直接切换或短回总览接下一章。"],["公司能力融入应用","工程梳理、运行复核、现场支持和资料整理穿插呈现，不另起公司历程段。"],["项目事实对应画面","预测性维护、视觉识别与自动知识更新不默认属于仁济已上线功能。"]],"groups":[],"mapping":[["安全生产兜底","04—07","状态监视、告警查询、现场核查、运行边界。"],["设备运维提效","08—11","设备档案、巡检任务、现场执行、记录回填。"],["能源消耗降本","12—16","能源分类、历史分析、智能调参、策略复盘。"],["知识资产沉淀","17—20","设备资料、规程检索、维护经验、人员交接。"]],"notes":["画册中的预测性维护、视觉违章识别、多能调度等，不直接当作仁济已上线内容。","知识治理材料含后续规划，具体查询或问答镜头以现有可操作功能为准。","不披露节能率、设备规模、运行参数或费用；不为拍摄启停或修改生产参数。"],"source":"结构采用四项价值与一屏总览；项目画面以可公开、可操作的实际应用为准。"},"storyline":{"headline":"一套平台 四项价值","text":"一屏总览串联安全、设备、能源、知识。每章按价值主张、平台应用、现场使用展开；公司实力和技术底座服务于这四项价值。","labels":["安全生产兜底","设备运维提效","能源消耗降本","知识资产沉淀"]}},"company":{"key":"company","title":"中金能源公司与平台展示片","short":"公司通用版","duration":160,"subtitle":"安全生产兜底 · 设备运维提效 · 能源消耗降本 · 知识资产沉淀","filename":"中金能源公司与平台展示片_160秒_四项价值主线执行稿.docx","shots":[{"id":"01","start":0,"end":6,"subject":"工程现场 中景","action":"我方工程师查看设备、核对现场资料，工装标识自然可见，固定侧拍真实工作。","cut":"沿核对资料的动作切技术讨论。","type":"live","stage":0},{"id":"02","start":6,"end":12,"subject":"工程与产品团队 双人中景","action":"真实成员核对设备关系和平台页面，展示现场理解与产品实施工作的联系；桌面资料先脱敏。","cut":"指向屏幕的动作接同一平台首页。","type":"live","stage":0},{"id":"03","start":12,"end":18,"subject":"统一平台 高清录屏","action":"展示能源与设备管理AI系统入口与公司原有标识，四项价值章名简洁出现。","cut":"从总览进入安全应用，章名安全生产兜底落下。","type":"screen","stage":0},{"id":"04","start":18,"end":24,"subject":"安全监视总览 高清录屏","action":"展示可用的运行状态、风险提示或安全管理入口，画面保持一个明确重点。","cut":"同一应用切到已验证识别功能或告警记录。","type":"screen","stage":1},{"id":"05","start":24,"end":31,"subject":"隐患识别或风险提示 高清录屏","action":"优先展示已验证的视觉识别或作业审批演示；没有真实功能页面时使用状态告警，章节旁白保持通用。","cut":"由风险提示切相关处置入口。","type":"screen","stage":1},{"id":"06","start":31,"end":37,"subject":"告警与处置协同 高清录屏","action":"演示告警记录、处理入口与已具备的协同功能，不用动画伪造全自动处置。","cut":"直接切工程师现场核查，连接信息与人员判断。","type":"screen","stage":1},{"id":"07","start":37,"end":44,"subject":"现场复核 中景","action":"工程师按现场要求查看设备并记录，保持正常工作状态，不为拍摄制造异常或启停设备。","cut":"记录动作接平台处置记录。","type":"live","stage":1},{"id":"08","start":44,"end":50,"subject":"安全处置记录 高清录屏","action":"展示状态更新、执行记录或相关规程，采用同一套演示账号。","cut":"短回总览，直接切设备档案，出现设备运维提效。","type":"screen","stage":1},{"id":"09","start":50,"end":58,"subject":"设备档案与状态 高清录屏","action":"打开同一设备的档案与状态信息；健康预测页面仅在已验证可用时展示。","cut":"同一设备切维护安排或巡检任务。","type":"screen","stage":2},{"id":"10","start":58,"end":66,"subject":"维护与报修安排 高清录屏","action":"选择一个真实功能，演示维护计划、保养任务或报修派工；每镜只完成一次操作。","cut":"任务查看动作接现场移动端。","type":"screen","stage":2},{"id":"11","start":66,"end":74,"subject":"移动执行 手机近景","action":"演示查看检查项、填写结论或拍照记录，手机角度避免反光，手指不遮挡主要按钮。","cut":"提交或返回后切执行记录页。","type":"live","stage":2},{"id":"12","start":74,"end":82,"subject":"执行与分析记录 高清录屏","action":"展示维护记录、异常分析或处理结果，强调可查询、可追溯，不附效率提升比例。","cut":"短回总览进入能源分类，出现能源消耗降本。","type":"screen","stage":2},{"id":"13","start":82,"end":88,"subject":"能源分类与计量 高清录屏","action":"展示能源分项与系统分类入口，隐藏客户名称及具体业务数字。","cut":"点选一类能源接历史分析页。","type":"screen","stage":3},{"id":"14","start":88,"end":95,"subject":"历史与能效分析 高清录屏","action":"展示趋势形态、分类比较或能效分析入口，使用明确标识的演示数据。","cut":"由分析关系切策略建议或负荷分析。","type":"screen","stage":3},{"id":"15","start":95,"end":102,"subject":"优化建议与负荷分析 高清录屏","action":"选择已验证的负荷分析、策略建议或多能调度页面；没有相应页面时保留能效查询。","cut":"切已具备的策略或调参记录，不制作收益跳字。","type":"screen","stage":3},{"id":"16","start":102,"end":108,"subject":"策略与调参记录 高清录屏","action":"以只读页面展示策略、状态与运行记录，不为拍摄下发生产指令，不露具体参数。","cut":"按视线或模块关系切工程师复核。","type":"screen","stage":3},{"id":"17","start":108,"end":114,"subject":"工程师复核 中景","action":"技术人员核对策略与设备运行条件，资料和界面对应，工装Logo可见。","cut":"短回总览进入知识资料入口，出现知识资产沉淀。","type":"live","stage":3},{"id":"18","start":114,"end":122,"subject":"资料与案例归档 高清录屏","action":"展示设备手册、规程、维护记录或已归档案例，文件均采用可公开演示内容。","cut":"选择一份资料，接搜索与查询。","type":"screen","stage":4},{"id":"19","start":122,"end":130,"subject":"检索与智能应用 高清录屏","action":"展示已验证的知识检索或问答，结果保留依据与来源。智能体仅展示现有可验证任务，无相关功能时改普通资料检索。","cut":"由查询结果切知识关系示意或已有本体界面。","type":"screen","stage":4},{"id":"20","start":130,"end":138,"subject":"知识关系 录屏或示意","action":"用设备、规则、经验之间的关系说明知识本体。没有真实界面时标明架构示意，避免概念图冒充软件。","cut":"从知识关系接实际培训与复盘。","type":"design","stage":4},{"id":"21","start":138,"end":146,"subject":"复盘培训与持续服务 中景","action":"工程师与使用人员查资料、做运行复盘或应用培训，择一动作完整拍摄，体现驻场支持与持续迭代。","cut":"音乐收束，直接切回工程现场。","type":"live","stage":4},{"id":"22","start":146,"end":150,"subject":"工程现场 全景","action":"设备、人员同框，选择与开头不同的构图，现场整洁、有工作状态。","cut":"沿相近构图接统一平台。","type":"live","stage":5},{"id":"23","start":150,"end":155,"subject":"平台与四项价值 高清录屏","action":"回到同一平台总览，四项价值章名统一出现，公司标识保留。","cut":"短叠化到静态公司片尾。","type":"screen","stage":5},{"id":"24","start":155,"end":160,"subject":"公司片尾 静态画面","action":"公司正式全称、Logo、统一产品名与已确认联系入口，排版克制。","cut":"完整静止五秒，配乐渐弱结束。","type":"desi const icon=n=>`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${icons[n]||icons.document}"/></svg>`;


function valueCards(){
const paths=['M12 3l8 4v6c0 5-8 9-8 9s-8-4-8-9V7z M8.5 12l2.5 2.5 4.5-5','M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M9 3h6l1 4 4 1v7l-4 1-1 5H9l-1-5-4-1V8l4-1z','M14 2L4 14h7l-1 8 10-12h-7z','M6 3h14v18H6a3 3 0 0 1 0-6h14 M6 3a3 3 0 0 0-3 3v12'];
return `<div class="value-cards">${d.product.values.map((v,i)=>`<button class="value-card" data-stage="${i+1}" aria-pressed="false" aria-label="查看${esc(v[0])}分镜"><svg class="value-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[i]}"/></svg><span class="value-title">${esc(v[0])}</span><span class="value-body">${esc(v[1])}</span><span class="value-link">查看本章分镜</span></button>`).join('')}</div>`;
}

function productSection(p){
const table=(headers,rows)=>`<div class="product-table-wrap"><table class="schedule product-mapping"><thead><tr>${headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
return `<section id="product"><div class="section-heading"><h2>${esc(p.heading)}</h2><span class="edition">四项价值主线版</span></div><p class="section-intro">${esc(p.intro)}</p>${p.architecture.length?`<details class="product-detail"><summary>技术底座与部署方式</summary><div class="architecture">${p.architecture.map(a=>`<div class="architecture-layer"><strong>${esc(a[0])}</strong><p>${esc(a[1])}</p></div>`).join('')}</div><p class="deployment-note">${esc(p.deployment)}</p></details>`:`<p class="deployment-note">${esc(p.deployment)}</p>`}<h3 class="product-subheading">能力与镜头对应</h3>${table(['展示重点','对应镜号','实现方式'],p.mapping)}<div class="delivery-grid">${p.delivery.map(a=>`<article><h3>${esc(a[0])}</h3><p>${esc(a[1])}</p></article>`).join('')}</div>${p.groups.length?`<details class="product-detail catalogue"><summary>查看完整产品场景 · ${p.groups.reduce((n,g)=>n+g[1].length,0)} 项</summary><p class="section-intro">这是产品选材目录；主片使用代表性功能，不逐项铺满。具体功能以可演示版本为准。</p><div class="catalogue-grid">${p.groups.map(g=>`<article><h3>${esc(g[0])}</h3><ul>${g[1].map(x=>`<li><span>${esc(x[0])}</span>${esc(x[1])}</li>`).join('')}</ul></article>`).join('')}</div></details>`:''}<details class="product-detail scope"><summary>拍摄口径与替代原则</summary><ul>${p.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul><p class="source-note">${esc(p.source)}</p></details></section>`;
}

const nav=[['overview','影片结构','timeline'],['product','产品与功能','box'],['shots','分镜脚本','film'],['voice','完整旁白','list'],['execution','拍摄执行','clap'],['assets','素材清单','box']];
const checklist=['正式项目名、产品名与片尾署名','公司 Logo 源文件与工装','可拍区域、日期及出镜人员','可展示功能与演示操作路径','脱敏演示账号和平台录屏','现场拍摄与对应镜号清单','临时配音及已确认的旁白','配乐、环境声与双份备份','画册能力与项目已用功能逐项核对','架构示意标注、真实录屏与替代镜头'];
let checked=[];try{checked=JSON.parse(localStorage.getItem('film-checks-'+key)||'[]');if(!Array.isArray(checked))checked=[];}catch{}
$('#app').innerHTML=`<aside class="sidebar"><div class="wordmark">中金能源</div><div class="doc-switch"><a href="renji-film.html?v=20261119-four-values" class="${key==='renji'?'active':''}" ${key==='renji'?'aria-current="page"':''}>${icon('document')}仁济医院版</a><a href="company-film.html?v=20261119-four-values" class="${key==='company'?'active':''}" ${key==='company'?'aria-current="page"':''}>${icon('document')}公司通用版</a></div><nav class="section-nav" aria-label="页面章节">${nav.map(([id,name,ic])=>`<a href="#${id}" data-nav="${id}">${icon(ic)}${name}</a>`).join('')}</nav><div class="sidebar-note">非叙事展示 · 不披露具体数据<br>镜头、旁白与执行统一查看</div></aside><main class="main"><header class="page-header"><div><h1>${esc(d.title)}</h1><p class="subtitle">${esc(d.subtitle)}</p></div><div class="actions"><button class="button" id="print">${icon('print')}打印方案</button><a class="button primary" href="film-guide-assets/${key}-guide.docx?v=20261119-four-values" download="${esc(d.filename)}">${icon('download')}下载 Word</a></div></header><div class="summary-strip"><div class="metric"><strong>${d.duration}</strong><span>秒</span></div><div class="metric"><strong>${d.shots.length}</strong><span>个镜头</span></div><div class="metric"><strong>${d.segments.length}</strong><span>个段落</span></div></div><section id="overview"><h2>一套平台，四项价值</h2><p class="section-intro">${esc(d.description)}点击价值卡片或时间轴，可查看对应分镜。</p>${valueCards()}<h3 class="timeline-heading">开场、四项价值与收口</h3><div class="timeline" style="--parts:${d.segments.length}">${d.segments.map((s,i)=>`<button class="stage" data-stage="${i}" aria-pressed="false"><span class="stage-name">${esc(s.title)}</span><span class="stage-time">${tm(s.start)} — ${tm(s.end)}</span><span class="stage-duration">${s.end-s.start} 秒</span></button>`).join('')}</div></section>${productSection(d.product)}<section id="shots"><h2>分镜脚本</h2><div class="toolbar"><label class="search">${icon('search')}<input id="shot-search" type="search" placeholder="搜索镜头内容，如：机房、平台、运维" aria-label="搜索镜头"></label><div class="filters" role="group" aria-label="素材类型"><button class="filter active" data-type="all" aria-pressed="true">全部</button><button class="filter" data-type="live" aria-pressed="false">现场实拍</button><button class="filter" data-type="screen" aria-pressed="false">平台录屏</button></div></div><div class="filter-status"><span id="result-count" aria-live="polite"></span><button class="clear-button" id="clear-filters">清除筛选</button></div><div class="table-wrap"><table class="shots"><thead><tr><th scope="col">镜号 / 时间</th><th scope="col">画面与机位</th><th scope="col">拍摄动作</th><th scope="col">镜头衔接</th></tr></thead><tbody id="shot-body"></tbody></table></div><p class="print-note">点击镜头行，可展开对应旁白。时间码为建议剪辑安排，正式配音后校准节奏。</p></section><section id="voice"><div class="section-heading"><h2>完整旁白</h2><button class="button" id="copy-all">复制全部旁白</button></div><p class="section-intro">按段落连续录制，句子可跨镜头延续；只保留已确认且可公开的功能表述。</p><div class="voice-list">${d.segments.map((s,i)=>`<article class="voice-block"><div class="voice-head"><div><span class="voice-time">${tm(s.start)} — ${tm(s.end)}</span><h3>${esc(s.title)}</h3></div><button class="copy-button" data-copy="${i}" aria-label="复制${esc(s.title)}旁白">复制</button></div><p>${esc(s.voice)}</p></article>`).join('')}</div></section><section id="execution"><h2>拍摄执行</h2><p class="section-intro">按场地集中拍摄，再按镜头顺序剪辑。每处拍齐全景、中景与特写，界面另录高清版本。</p>${d.schedules.map(s=>`<table class="schedule"><thead><tr>${s.headers.map(x=>`<th scope="col">${esc(x)}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`).join('')}<div class="method-grid">${d.methods.map(m=>`<article class="method"><h3>${esc(m.title)}</h3>${m.text.map(t=>`<p>${esc(t)}</p>`).join('')}${(m.tables||[]).map(t=>`<table class="schedule"><thead><tr>${t.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`).join('')}</article>`).join('')}</div></section><section id="assets"><div class="section-heading"><h2>素材清单</h2><span class="check-progress" id="check-progress"></span></div><p class="section-intro">按实际准备情况勾选，进度保留在当前浏览器。</p><div class="checklist">${checklist.map((x,i)=>`<label class="check-item ${checked.includes(i)?'done':''}"><input type="checkbox" data-check="${i}" ${checked.includes(i)?'checked':''}><span>${esc(x)}</span></label>`).join('')}</div><button class="clear-button" id="reset-checks">重置准备状态</button></section><footer class="footer"><div>${esc(d.short)} · 拍摄执行手册<br>保留实际功能，统一脱敏展示。网页仅展示拍摄方案，不代表成片已完成。</div><div><a href="https://www.adobe.com/creativecloud/video/discover/shot-list.html" target="_blank" rel="noopener">镜头清单方法</a><a href="${key==='renji'?'company-film':'renji-film'}.html?v=20261119-four-values">查看${key==='renji'?'公司通用版':'仁济医院版'}</a></div></footer></main><div id="toast" class="toast" role="status" hidden></div>`;
function renderShots(){const rows=d.shots.filter(s=>(type==='all'||s.type===type)&&(stage===null||s.stage===stage)&&(!query||[s.id,s.subject,s.action,s.cut,d.segments[s.stage].title].join(' ').toLowerCase().includes(query)));
$('#result-count').textContent=`显示 ${rows.length} / ${d.shots.length} 个镜头${stage===null?'':' · '+d.segments[stage].title} · 点击镜头展开旁白`;
$('#shot-body').innerHTML=rows.length?rows.map(s=>`<tr class="shot-row ${selected===s.id?'selected':''}" data-shot="${s.id}" tabindex="0" role="button" aria-expanded="${selected===s.id}" aria-label="镜头${s.id} ${esc(s.subject)}，查看旁白"><td><span class="shot-number">${s.id}</span><span class="shot-time">${tm(s.start)}–${tm(s.end)}</span></td><td><span class="shot-subject">${esc(s.subject)}</span><span class="shot-type">${s.type==='screen'?'平台录屏':s.type==='live'?'现场实拍':'图形包装'} · ${s.end-s.start} 秒</span></td><td>${esc(s.action)}</td><td>${esc(s.cut)}</td></tr>${selected===s.id?`<tr class="inspector"><td colspan="4"><div class="inspector-layout"><div class="inspector-title">镜头 ${s.id}<br><small>${esc(d.segments[s.stage].title)}</small></div><div><small>本段旁白</small><p>${esc(d.segments[s.stage].voice)}</p><small>旁白在整个段落内分配，无需在本镜头内全部读完。</small></div></div></td></tr>`:''}`).join(''):'<tr><td colspan="4" class="no-results">没有匹配的镜头，请调整关键词或清除筛选。</td></tr>';
document.querySelectorAll('.stage,.value-card').forEach(x=>x.setAttribute('aria-pressed',String(stage===Number(x.dataset.stage))));
document.querySelectorAll('[data-shot]').forEach(x=>{const select=()=>{selected=selected===x.dataset.shot?null:x.dataset.shot;renderShots();};x.addEventListener('click',select);x.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select();}});});}
function notify(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,2200);}
async function copy(t){try{await navigator.clipboard.writeText(t);notify('旁白已复制');}catch{const el=document.createElement('textarea');el.value=t;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();const ok=document.execCommand('copy');el.remove();notify(ok?'旁白已复制':'复制未完成，请选择文字后复制');}}
$('#shot-search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();renderShots();});
document.querySelectorAll('[data-type]').forEach(x=>x.addEventListener('click',()=>{type=x.dataset.type;document.querySelectorAll('[data-type]').forEach(b=>{b.classList.toggle('active',b===x);b.setAttribute('aria-pressed',String(b===x));});renderShots();}));
document.querySelectorAll('[data-stage]').forEach(x=>x.addEventListener('click',()=>{stage=stage===Number(x.dataset.stage)?null:Number(x.dataset.stage);type='all';query='';$('#shot-search').value='';document.querySelectorAll('[data-type]').forEach(b=>{b.classList.toggle('active',b.dataset.type==='all');b.setAttribute('aria-pressed',String(b.dataset.type==='all'));});renderShots();$('#shots').scrollIntoView({behavior:'smooth'});}));
$('#clear-filters').addEventListener('click',()=>{stage=null;type='all';query='';$('#shot-search').value='';document.querySelectorAll('[data-type]').forEach(b=>{b.classList.toggle('active',b.dataset.type==='all');b.setAttribute('aria-pressed',String(b.dataset.type==='all'));});renderShots();});
$('#copy-all').addEventListener('click',()=>copy(d.segments.map(x=>`${x.time} ${x.title}\n${x.voice}`).join('\n\n')));document.querySelectorAll('[data-copy]').forEach(x=>x.addEventListener('click',()=>copy(d.segments[Number(x.dataset.copy)].voice)));
function updateChecks(){checked=Array.from(document.querySelectorAll('[data-check]:checked')).map(x=>Number(x.dataset.check));document.querySelectorAll('[data-check]').forEach(x=>x.closest('label').classList.toggle('done',x.checked));$('#check-progress').textContent=`已准备 ${checked.length} / ${checklist.length} 项`;try{localStorage.setItem('film-checks-'+key,JSON.stringify(checked));}catch{}}
document.querySelectorAll('[data-check]').forEach(x=>x.addEventListener('change',updateChecks));$('#reset-checks').addEventListener('click',()=>{document.querySelectorAll('[data-check]').forEach(x=>x.checked=false);updateChecks();});
$('#print').addEventListener('click',()=>{const detailStates=Array.from(document.querySelectorAll('details')).map(el=>[el,el.open]);detailStates.forEach(([el])=>el.open=true);const old={query,type,stage,selected};query='';type='all';stage=null;selected=null;renderShots();window.print();detailStates.forEach(([el,open])=>el.open=open);({query,type,stage,selected}=old);renderShots();});
if('IntersectionObserver' in window){const observer=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting)document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===e.target.id));});},{rootMargin:'-5% 0px -65% 0px'});document.querySelectorAll('main section').forEach(x=>observer.observe(x));}
renderShots();updateChecks();
})();
</script></body></html>
